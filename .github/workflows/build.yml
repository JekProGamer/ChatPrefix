name: Build ChatPrefix

on:
  push:
    paths:
      - "ChatPrefix/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "ChatPrefix/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore ChatPrefix/ChatPrefix.csproj
      - run: dotnet build ChatPrefix/ChatPrefix.csproj -c Release --no-restore
      - uses: actions/upload-artifact@v4
        with:
          name: ChatPrefix
          path: ChatPrefix/bin/Release/net10.0/ChatPrefix.dll
